<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloCruceros · Reserve Email Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1f2329;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #2b313a;
    border-bottom: 1px solid #11141a;
    flex: 0 0 auto;
  }
  .toolbar h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    margin-right: auto;
    opacity: .85;
  }
  .seg {
    display: inline-flex;
    background: #1f2329;
    border-radius: 6px;
    padding: 2px;
    border: 1px solid #11141a;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: #b9c0cc;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    transition: all .12s;
  }
  .seg button.active {
    background: #057AFF;
    color: #fff;
  }
  .status {
    font-size: 12px;
    opacity: .6;
    min-width: 90px;
    text-align: right;
  }
  .stage {
    flex: 1 1 auto;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
  }
  .frame-wrap {
    background: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    border-radius: 6px;
    overflow: hidden;
    transition: width .2s ease;
    width: 701px;
    max-width: 100%;
  }
  .frame-wrap.mobile { width: 375px; }
  .frame-wrap.web { width: 100%; max-width: 100%; }
  iframe {
    display: block;
    border: 0;
    width: 100%;
    min-height: calc(100vh - 100px);
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>SoloCruceros · Reserve</h1>
    <div class="seg" id="seg">
      <button data-w="700" class="active">Desktop · 700</button>
      <button data-w="375">Mobile · 375</button>
      <button data-w="web">Web · 100%</button>
    </div>
    <span class="status" id="status">conectando…</span>
  </div>
  <div class="stage">
    <div class="frame-wrap" id="wrap">
      <iframe id="frame" src="/render"></iframe>
    </div>
  </div>

<script>
  const frame = document.getElementById('frame');
  const wrap  = document.getElementById('wrap');
  const status = document.getElementById('status');

  document.getElementById('seg').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#seg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    wrap.classList.toggle('mobile', btn.dataset.w === '375');
    wrap.classList.toggle('web', btn.dataset.w === 'web');
  });

  const ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws');
  ws.onopen  = () => { status.textContent = 'live'; status.style.opacity = .6; };
  ws.onclose = () => { status.textContent = 'desconectado'; status.style.opacity = 1; };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'reload') {
      status.textContent = 'recargando…';
      frame.contentWindow.location.replace('/render');
      setTimeout(() => { status.textContent = 'live'; status.style.opacity = .6; }, 400);
    }
  };
</script>
</body>
</html>
