<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoloCruceros · Reserve Email Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1f2329;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: #2b313a;
    border-bottom: 1px solid #11141a;
    flex: 0 0 auto;
    flex-wrap: wrap;
  }
  .toolbar h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    margin-right: auto;
    opacity: .85;
  }
  .seg {
    display: inline-flex;
    background: #1f2329;
    border-radius: 6px;
    padding: 2px;
    border: 1px solid #11141a;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: #b9c0cc;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    transition: all .12s;
  }
  .seg button.active {
    background: #057AFF;
    color: #fff;
  }
  .mockup-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #b9c0cc;
    cursor: pointer;
    user-select: none;
  }
  .mockup-toggle input { cursor: pointer; accent-color: #057AFF; }
  .mockup-toggle.disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
  .send-btn {
    border: 0;
    background: #1a8a3c;
    color: #fff;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 6px;
    transition: background .12s, opacity .12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .send-btn:hover:not(:disabled) { background: #21a347; }
  .send-btn:disabled { opacity: .55; cursor: default; }
  .send-btn.error { background: #a32323; }
  .send-btn.error:hover:not(:disabled) { background: #c12828; }
  .send-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #fff; opacity: .6;
  }
  .send-btn.busy .send-dot {
    opacity: 1;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .status {
    font-size: 12px;
    opacity: .6;
    min-width: 90px;
    text-align: right;
  }
  .stage {
    flex: 1 1 auto;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
  }
  .frame-wrap {
    background: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    border-radius: 6px;
    overflow: hidden;
    transition: width .2s ease;
    width: 701px;
    max-width: 100%;
  }
  .frame-wrap.mobile { width: 390px; }
  .frame-wrap.web { width: 100%; max-width: 100%; }
  iframe {
    display: block;
    border: 0;
    width: 100%;
    min-height: calc(100vh - 100px);
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>SoloCruceros · Reserve</h1>
    <div class="seg" id="seg">
      <button data-w="700" class="active">Desktop · 700</button>
      <button data-w="390">Mobile · 390</button>
      <button data-w="web">Web · 100%</button>
    </div>
    <div class="seg" id="clientSeg">
      <button data-client="original" class="active" title="Sin filtrar CSS">Original</button>
      <button data-client="gmail-web" title="Gmail Web">Gmail</button>
      <button data-client="outlook-windows" title="Outlook Windows">Outlook</button>
      <button data-client="apple-mail" title="Apple Mail">Apple</button>
      <button data-client="yahoo-mail" title="Yahoo Mail">Yahoo</button>
    </div>
    <label class="mockup-toggle" id="mockupLabel" title="Mostrar el email dentro de la interfaz del cliente (Gmail/Outlook)">
      <input type="checkbox" id="mockupToggle">
      <span>Mockup</span>
    </label>
    <button class="send-btn" id="sendBtn" title="Enviar el email renderizado a TEST_TO">
      <span class="send-dot"></span>
      <span id="sendLabel">Enviar prueba</span>
    </button>
    <span class="status" id="status">conectando…</span>
  </div>
  <div class="stage">
    <div class="frame-wrap" id="wrap">
      <iframe id="frame" src="/render"></iframe>
    </div>
  </div>

<script>
  const frame = document.getElementById('frame');
  const wrap  = document.getElementById('wrap');
  const status = document.getElementById('status');

  document.getElementById('seg').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#seg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    wrap.classList.toggle('mobile', btn.dataset.w === '390');
    wrap.classList.toggle('web', btn.dataset.w === 'web');
  });

  // --- Selector de cliente + mockup ---
  let currentClient = 'original';
  let mockupEnabled = false;
  const clientSeg = document.getElementById('clientSeg');
  const mockupToggle = document.getElementById('mockupToggle');
  const mockupLabel = document.getElementById('mockupLabel');

  const MOCKUP_CLIENTS = new Set([
    'gmail-web', 'gmail-android', 'gmail-ios',
    'outlook-windows', 'outlook-web', 'outlook-mac',
  ]);

  function clientHasMockup(c) {
    return MOCKUP_CLIENTS.has(c);
  }

  function reloadFrame() {
    status.textContent = 'cargando…';

    // Mockup = documento completo → navegar el iframe
    if (mockupEnabled && clientHasMockup(currentClient)) {
      frame.src = '/preview/' + currentClient;
      frame.onload = () => {
        status.textContent = 'live';
        status.style.opacity = .6;
      };
      return;
    }

    // Vista limpia: swap head/body (preserva caché de imágenes)
    const url = currentClient === 'original' ? '/render' : '/render/' + currentClient;
    fetch(url, { cache: 'no-cache' })
      .then(r => r.text())
      .then(html => {
        const doc = frame.contentDocument;
        if (!doc) {
          // Si el iframe tiene un src de mockup, hay que volver a /render
          frame.src = url;
          frame.onload = () => {
            status.textContent = 'live';
            status.style.opacity = .6;
          };
          return;
        }
        const parsed = new DOMParser().parseFromString(html, 'text/html');
        doc.head.innerHTML = parsed.head.innerHTML;
        doc.body.innerHTML = parsed.body.innerHTML;
        status.textContent = 'live';
        status.style.opacity = .6;
      })
      .catch(err => {
        console.error('[client]', err);
        status.textContent = 'error';
      });
  }

  clientSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#clientSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentClient = btn.dataset.client;

    const hasChrome = clientHasMockup(currentClient);
    if (!hasChrome && mockupEnabled) {
      mockupEnabled = false;
      mockupToggle.checked = false;
    }
    mockupLabel.classList.toggle('disabled', !hasChrome);
    reloadFrame();
  });

  mockupToggle.addEventListener('change', () => {
    mockupEnabled = mockupToggle.checked;
    if (mockupEnabled) {
      // Forzar width web para ver el chrome completo
      document.querySelectorAll('#seg button').forEach(b => b.classList.remove('active'));
      const webBtn = document.querySelector('#seg button[data-w="web"]');
      if (webBtn) webBtn.classList.add('active');
      wrap.classList.remove('mobile');
      wrap.classList.add('web');
    }
    reloadFrame();
  });

  // --- Enviar prueba por SMTP ---
  const sendBtn = document.getElementById('sendBtn');
  const sendLabel = document.getElementById('sendLabel');
  let sending = false;

  async function enviarPrueba() {
    if (sending) return;
    sending = true;
    sendBtn.disabled = true;
    sendBtn.classList.remove('error');
    sendBtn.classList.add('busy');
    sendLabel.textContent = 'Enviando…';
    try {
      const r = await fetch('/send-test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) {
        throw new Error(data.error || ('HTTP ' + r.status));
      }
      sendLabel.textContent = 'Enviado a ' + (data.to || '?');
      status.textContent = 'enviado OK';
      status.style.opacity = 1;
      setTimeout(() => { sendLabel.textContent = 'Enviar prueba'; }, 4000);
    } catch (err) {
      console.error('[send]', err);
      sendBtn.classList.add('error');
      sendLabel.textContent = 'Error';
      const hint = err.message.includes('Faltan credenciales')
        ? 'Falta .env (ver consola)'
        : 'Revisa consola (F12)';
      status.textContent = hint;
      status.style.opacity = 1;
    } finally {
      sendBtn.classList.remove('busy');
      sendBtn.disabled = false;
      sending = false;
    }
  }

  sendBtn.addEventListener('click', enviarPrueba);

  const ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws');
  ws.onopen  = () => { status.textContent = 'live'; status.style.opacity = .6; };
  ws.onclose = () => { status.textContent = 'desconectado'; status.style.opacity = 1; };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'reload') {
      status.textContent = 'recargando…';
      reloadFrame();
    }
  };
</script>
</body>
</html>
