<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoloCruceros · Reserve Email Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1f2329;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #2b313a;
      border-bottom: 1px solid #11141a;
      flex: 0 0 auto;
      flex-wrap: wrap;
    }

    .toolbar h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .3px;
      margin-right: auto;
      opacity: .85;
    }

    .tpl-sel {
      background: #1f2329;
      color: #e6e6e6;
      border: 1px solid #11141a;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .tpl-sel:focus {
      outline: 1px solid #057AFF;
    }

    .seg {
      display: inline-flex;
      background: #1f2329;
      border-radius: 6px;
      padding: 2px;
      border: 1px solid #11141a;
    }

    .seg button {
      border: 0;
      background: transparent;
      color: #b9c0cc;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: all .12s;
    }

    .seg button.active {
      background: #057AFF;
      color: #fff;
    }

    .mockup-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #b9c0cc;
      cursor: pointer;
      user-select: none;
    }

    .mockup-toggle input {
      cursor: pointer;
      accent-color: #057AFF;
    }

    .mockup-toggle.disabled {
      opacity: .4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .send-btn {
      border: 0;
      background: #1a8a3c;
      color: #fff;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: background .12s, opacity .12s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .send-btn:hover:not(:disabled) {
      background: #21a347;
    }

    .send-btn:disabled {
      opacity: .55;
      cursor: default;
    }

    .send-btn.error {
      background: #a32323;
    }

    .send-btn.error:hover:not(:disabled) {
      background: #c12828;
    }

    .send-wrap {
      position: relative;
    }

    .send-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #2b313a;
      border: 1px solid #11141a;
      border-radius: 8px;
      padding: 12px;
      width: 512px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
    }

    .send-panel.open {
      display: flex;
    }

    .send-panel label {
      font-size: 11px;
      color: #b9c0cc;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .send-panel input,
    .send-panel textarea {
      background: #1f2329;
      color: #e6e6e6;
      border: 1px solid #11141a;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
    }

    .send-panel input:focus,
    .send-panel textarea:focus {
      outline: 1px solid #057AFF;
    }

    .send-panel textarea {
      resize: vertical;
      min-height: 54px;
      line-height: 1.5;
    }

    .send-panel .panel-hint {
      font-size: 11px;
      opacity: .5;
      line-height: 1.4;
    }

    .send-panel .panel-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .send-panel .panel-cancel {
      border: 0;
      background: transparent;
      color: #b9c0cc;
      font-size: 12px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .send-panel .panel-cancel:hover {
      background: #1f2329;
    }

    .send-panel .panel-send {
      border: 0;
      background: #1a8a3c;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 24px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .send-panel .panel-send:hover:not(:disabled) {
      background: #21a347;
    }

    .send-panel .panel-send:disabled {
      opacity: .55;
      cursor: default;
    }

    .send-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      opacity: .6;
    }

    .send-btn.busy .send-dot {
      opacity: 1;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .3;
      }

      50% {
        opacity: 1;
      }
    }

    .status {
      font-size: 12px;
      opacity: .6;
      min-width: 90px;
      text-align: right;
    }

    .stage {
      flex: 1 1 auto;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }

    .frame-wrap {
      background: #fff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
      border-radius: 6px;
      overflow: hidden;
      transition: width .2s ease;
      width: 760px;
      max-width: 100%;
    }

    .frame-wrap.mobile {
      width: 390px;
    }

    .frame-wrap.web {
      width: 100%;
      max-width: 100%;
    }

    iframe {
      display: block;
      border: 0;
      width: 100%;
      min-height: calc(100vh - 100px);
    }
  </style>
</head>

<body>
  <div class="toolbar">
    <select id="tplSel" class="tpl-sel" title="Proyecto / plantilla"></select>
    <h1>SoloCruceros · Reserve</h1>
    <div class="seg" id="seg">
      <button data-w="760" class="active">Desktop · 760</button>
      <button data-w="390">Mobile · 390</button>
      <button data-w="web">Web · 100%</button>
    </div>
    <div class="seg" id="clientSeg">
      <button data-client="original" class="active" title="Sin filtrar CSS">Original</button>
      <button data-client="gmail-web" title="Gmail Web">Gmail</button>
      <button data-client="outlook-windows" title="Outlook Windows">Outlook</button>
      <button data-client="apple-mail" title="Apple Mail">Apple</button>
      <button data-client="yahoo-mail" title="Yahoo Mail">Yahoo</button>
    </div>
    <label class="mockup-toggle" id="mockupLabel" title="Mostrar el email dentro de la interfaz del cliente (Gmail/Outlook)">
      <input type="checkbox" id="mockupToggle">
      <span>Mockup</span>
    </label>
    <div class="send-wrap">
      <button class="send-btn" id="sendBtn" title="Enviar el email renderizado por SMTP">
        <span class="send-dot"></span>
        <span id="sendLabel">Enviar prueba</span>
      </button>
      <div class="send-panel" id="sendPanel">
        <label>Para
          <input type="text" id="sendTo" placeholder="destino@ejemplo.com" autocomplete="off" spellcheck="false">
        </label>
        <label>CC (opcional, uno por línea o separado por comas)
          <textarea id="sendCc" rows="3" placeholder="otro@ejemplo.com&#10;otro2@ejemplo.com" autocomplete="off" spellcheck="false"></textarea>
        </label>
        <label>Asunto
          <input type="text" id="sendSubject" autocomplete="off" spellcheck="false">
        </label>
        <div class="panel-hint">Prellenado con .env; lo que escribas aquí solo aplica a este envío y se recuerda por plantilla. En el asunto, {{tpl}} y {{project}} se reemplazan por la plantilla/proyecto seleccionado.</div>
        <div class="panel-actions">
          <button type="button" class="panel-cancel" id="sendCancel">Cancelar</button>
          <button type="button" class="panel-send" id="sendConfirm">
            <span class="send-dot"></span>
            <span>Enviar</span>
          </button>
        </div>
      </div>
    </div>
    <span class="status" id="status">conectando…</span>
  </div>
  <div class="stage">
    <div class="frame-wrap" id="wrap">
      <iframe id="frame"></iframe>
    </div>
  </div>

  <script>
    const frame = document.getElementById('frame');
    const wrap = document.getElementById('wrap');
    const status = document.getElementById('status');
    const tplSel = document.getElementById('tplSel');

    // --- Selector de proyecto/plantilla ---
    let routeBase = '/solocruceros/reserve';

    function onTplChange(updateUrl) {
      const [projectId, tplId] = tplSel.value.split('/');
      routeBase = '/' + projectId + '/' + tplId;
      document.querySelector('.toolbar h1').textContent = projectId + ' · ' + tplId;
      closeSendPanel();
      if (updateUrl) history.replaceState(null, '', '?project=' + projectId + '&tpl=' + tplId);
      reloadFrame();
    }

    async function initTemplates() {
      let projects = [];
      try {
        const r = await fetch('/api/templates', { cache: 'no-cache' });
        projects = (await r.json()).projects || [];
      } catch (err) {
        console.error('[templates]', err);
      }
      for (const p of projects) {
        for (const t of p.templates) {
          const id = typeof t === 'string' ? t : t.id;
          const opt = document.createElement('option');
          opt.value = p.id + '/' + id;
          opt.textContent = p.id + ' / ' + id + (p.available ? '' : ' (no disponible)');
          tplSel.appendChild(opt);
        }
      }
      if (!tplSel.options.length) {
        status.textContent = 'sin plantillas';
        return;
      }
      const q = new URLSearchParams(location.search);
      const want = q.get('project') && q.get('tpl') ? q.get('project') + '/' + q.get('tpl') : null;
      const has = want && [...tplSel.options].some((o) => o.value === want);
      if (has) {
        tplSel.value = want;
      } else {
        const p = projects.find((x) => x.available && x.templates.length) || projects[0];
        const first = p.templates[0];
        tplSel.value = p.id + '/' + (typeof first === 'string' ? first : first.id);
      }
      tplSel.addEventListener('change', () => onTplChange(true));
      onTplChange(false);
    }

    document.getElementById('seg').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      document.querySelectorAll('#seg button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      wrap.classList.toggle('mobile', btn.dataset.w === '390');
      wrap.classList.toggle('web', btn.dataset.w === 'web');
    });

    // --- Selector de cliente + mockup ---
    let currentClient = 'original';
    let mockupEnabled = false;
    const clientSeg = document.getElementById('clientSeg');
    const mockupToggle = document.getElementById('mockupToggle');
    const mockupLabel = document.getElementById('mockupLabel');

    const MOCKUP_CLIENTS = new Set([
      'gmail-web', 'gmail-android', 'gmail-ios',
      'outlook-windows', 'outlook-web', 'outlook-mac',
    ]);

    function clientHasMockup(c) {
      return MOCKUP_CLIENTS.has(c);
    }

    function reloadFrame() {
      status.textContent = 'cargando…';

      // Mockup = documento completo → navegar el iframe
      if (mockupEnabled && clientHasMockup(currentClient)) {
        frame.src = routeBase + '/preview/' + currentClient;
        frame.onload = () => {
          status.textContent = 'live';
          status.style.opacity = .6;
        };
        return;
      }

      // Vista limpia: swap head/body (preserva caché de imágenes)
      const url = currentClient === 'original' ? routeBase + '/render' : routeBase + '/render/' + currentClient;
      fetch(url, { cache: 'no-cache' })
        .then(r => r.text().then(html => ({ ok: r.ok, html })))
        .then(({ ok, html }) => {
          const doc = frame.contentDocument;
          if (!doc) {
            // Si el iframe tiene un src de mockup, hay que volver a /render
            frame.src = url;
            frame.onload = () => {
              status.textContent = 'live';
              status.style.opacity = .6;
            };
            return;
          }
          if (!ok) {
            // Error (p.ej. plantilla no disponible en esta maquina): mostrar el motivo
            const parsed = new DOMParser().parseFromString('<pre></pre>', 'text/html');
            parsed.body.firstChild.textContent = html;
            doc.head.innerHTML = '';
            doc.body.innerHTML = parsed.body.innerHTML;
            status.textContent = 'error';
            status.style.opacity = 1;
            return;
          }
          const parsed = new DOMParser().parseFromString(html, 'text/html');
          doc.head.innerHTML = parsed.head.innerHTML;
          doc.body.innerHTML = parsed.body.innerHTML;
          doc.body.style.margin = 0;
          status.textContent = 'live';
          status.style.opacity = .6;
        })
        .catch(err => {
          console.error('[client]', err);
          status.textContent = 'error';
        });
    }

    clientSeg.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      document.querySelectorAll('#clientSeg button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentClient = btn.dataset.client;

      const hasChrome = clientHasMockup(currentClient);
      if (!hasChrome && mockupEnabled) {
        mockupEnabled = false;
        mockupToggle.checked = false;
      }
      mockupLabel.classList.toggle('disabled', !hasChrome);
      reloadFrame();
    });

    mockupToggle.addEventListener('change', () => {
      mockupEnabled = mockupToggle.checked;
      if (mockupEnabled) {
        // Forzar width web para ver el chrome completo
        document.querySelectorAll('#seg button').forEach(b => b.classList.remove('active'));
        const webBtn = document.querySelector('#seg button[data-w="web"]');
        if (webBtn) webBtn.classList.add('active');
        wrap.classList.remove('mobile');
        wrap.classList.add('web');
      }
      reloadFrame();
    });

    // --- Enviar prueba por SMTP ---
    const sendBtn = document.getElementById('sendBtn');
    const sendLabel = document.getElementById('sendLabel');
    const sendPanel = document.getElementById('sendPanel');
    const sendTo = document.getElementById('sendTo');
    const sendCc = document.getElementById('sendCc');
    const sendSubject = document.getElementById('sendSubject');
    const sendConfirm = document.getElementById('sendConfirm');
    const sendCancel = document.getElementById('sendCancel');
    let sending = false;
    let sendDefaults = { to: '', cc: '', subject: '' };

    fetch('/api/send-config', { cache: 'no-cache' })
      .then(r => r.json())
      .then((cfg) => { sendDefaults = cfg; })
      .catch(() => { });

    function cfgKey() { return 'sendCfg:' + routeBase; }

    /* {{project}} → proyecto, {{tpl}} (o cualquier {{...}}) → plantilla seleccionada */
    function resolveSubjectPlaceholders(v) {
      const [projectId, tplId] = tplSel.value.split('/');
      return String(v || '')
        .replace(/\{\{\s*project\s*\}\}/gi, projectId)
        .replace(/\{\{[^{}]*\}\}/g, tplId);
    }

    function openSendPanel() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(cfgKey()) || '{}'); } catch (e) { }
      sendTo.value = saved.to != null ? saved.to : sendDefaults.to;
      sendCc.value = saved.cc != null ? saved.cc : sendDefaults.cc;
      sendSubject.value = resolveSubjectPlaceholders(saved.subject != null ? saved.subject : sendDefaults.subject);
      sendPanel.classList.add('open');
      sendSubject.focus();
      sendSubject.select();
    }

    function closeSendPanel() {
      sendPanel.classList.remove('open');
    }

    function persistSendCfg() {
      try {
        localStorage.setItem(cfgKey(), JSON.stringify({
          to: sendTo.value.trim(),
          cc: sendCc.value.trim(),
          subject: sendSubject.value,
        }));
      } catch (e) { }
    }

    function markSendError(hint) {
      sendBtn.classList.add('error');
      sendLabel.textContent = 'Error';
      status.textContent = hint;
      status.style.opacity = 1;
    }

    function normalizeCc(v) {
      return v.trim().replace(/\s*[\n\r;]+\s*/g, ', ');
    }

    async function enviarPrueba() {
      if (sending) return;
      sending = true;
      sendBtn.disabled = true;
      sendConfirm.disabled = true;
      sendBtn.classList.remove('error');
      sendBtn.classList.add('busy');
      sendLabel.textContent = 'Enviando…';
      const payload = {
        to: sendTo.value.trim(),
        cc: normalizeCc(sendCc.value),
        subject: sendSubject.value,
      };
      persistSendCfg();
      try {
        const r = await fetch(routeBase + '/send-test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await r.json();
        if (!r.ok || !data.ok) {
          throw new Error(data.error || ('HTTP ' + r.status));
        }
        closeSendPanel();
        sendLabel.textContent = 'Enviado a ' + (data.to || '?');
        status.textContent = 'enviado OK';
        status.style.opacity = 1;
        setTimeout(() => { sendLabel.textContent = 'Enviar prueba'; }, 4000);
      } catch (err) {
        console.error('[send]', err);
        const hint = err.message.includes('Faltan credenciales')
          ? 'Falta .env (ver consola)'
          : 'Revisa consola (F12)';
        markSendError(hint);
      } finally {
        sendBtn.classList.remove('busy');
        sendBtn.disabled = false;
        sendConfirm.disabled = false;
        sending = false;
      }
    }

    sendBtn.addEventListener('click', () => {
      if (sendPanel.classList.contains('open')) { closeSendPanel(); return; }
      openSendPanel();
    });

    sendCancel.addEventListener('click', closeSendPanel);
    sendConfirm.addEventListener('click', enviarPrueba);

    [sendTo, sendSubject].forEach((el) => el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); enviarPrueba(); }
    }));

    [sendTo, sendCc, sendSubject].forEach((el) => el.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSendPanel();
    }));

    document.addEventListener('click', (e) => {
      if (!sendPanel.classList.contains('open')) return;
      if (e.target.closest('.send-wrap')) return;
      closeSendPanel();
    });

    const ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws');
    ws.onopen = () => { status.textContent = 'live'; status.style.opacity = .6; };
    ws.onclose = () => { status.textContent = 'desconectado'; status.style.opacity = 1; };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'reload') {
        status.textContent = 'recargando…';
        reloadFrame();
      }
    };

    initTemplates();

  </script>
</body>

</html>
