[project]
name = "scripts"
version = "0.1.0"
description = "Arsenal de herramientas globales"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zai-sdk>=0.2.3",
    "psutil>=6.0.0",
]

[project.scripts]
xtool = "xtool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xtool"]
